version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - cd nextjs-app
        - npm ci --legacy-peer-deps
    build:
      commands:
        - npm run build
        - echo "✅ Next.js build completed with SSR support"
  artifacts:
    baseDirectory: nextjs-app/.next
    files:
      - '**/*'
  cache:
    paths:
      - nextjs-app/node_modules/**/*
      - nextjs-app/.next/cache/**/*