version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm install
        - cd nextjs-app
    build:
      commands:
        - npm run build
        - echo "✅ Next.js build completed"
  artifacts:
    baseDirectory: nextjs-app/out
    files:
      - '**/*'
  cache:
    paths:
      - nextjs-app/node_modules/**/*